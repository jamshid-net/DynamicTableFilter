name: Publish to NuGet

on:
  push:
    branches: [ "main" ]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          
      - name: Build and Pack
        run: dotnet build TableFilter/TableFilter.csproj -c Release
        
      - name: Run Tests
        run: dotnet test -c Release --no-build
        
      - name: Push to NuGet
        run: dotnet nuget push TableFilter/bin/Release/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }}
